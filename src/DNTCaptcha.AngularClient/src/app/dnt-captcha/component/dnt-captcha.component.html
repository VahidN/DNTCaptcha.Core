<label [htmlFor]="captchaInputId()" class="form-label">{{
  mode() === 'audio' ? 'Captcha digits you hear:' : 'Captcha:'
}}</label>
<div class="captcha-controls" [attr.aria-busy]="state().status === 'loading' || isAudioLoading()">
  @if (captchaImageUrl()) {
    <div class="captcha-image position-relative">
      <img [ngSrc]="captchaImageUrl()" fill="true" alt="CAPTCHA challenge" priority="true" (error)="onImageError()" />
    </div>
  }
  @if (mode() === 'audio') {
    <button
      type="button"
      class="btn btn-outline-secondary captcha-icon-button captcha-listen"
      [disabled]="busy() || state().status !== 'ready' || isAudioLoading() || audioCooldown.active()"
      [attr.aria-label]="isAudioLoading() ? 'Loading audio…' : isPlaying() ? 'Stop audio' : 'Play audio'"
      [title]="isAudioLoading() ? 'Loading audio…' : isPlaying() ? 'Stop audio' : 'Play audio'"
      [attr.aria-busy]="isAudioLoading()"
      [attr.aria-describedby]="statusId()"
      (click)="playCaptcha()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="currentColor"
        viewBox="0 0 16 16"
        class="bi"
        [class.bi-play-fill]="!isPlaying()"
        [class.bi-stop-fill]="isPlaying()"
        aria-hidden="true"
        focusable="false"
      >
        @if (isPlaying()) {
          <path
            d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5z"
          />
        } @else {
          <path
            d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"
          />
        }
      </svg>
    </button>
  }
  <button
    type="button"
    title="Refresh captcha"
    aria-label="Refresh captcha"
    class="btn btn-outline-secondary captcha-icon-button"
    [disabled]="busy() || state().status === 'loading' || cooldown.active()"
    [attr.aria-describedby]="statusId()"
    (click)="loadNewCaptcha()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      fill="currentColor"
      class="bi bi-arrow-repeat"
      viewBox="0 0 16 16"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"
      />
      <path
        fill-rule="evenodd"
        d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"
      />
    </svg>
  </button>
  <div class="captcha-input">
    <input
      [formField]="captchaForm().dntCaptchaInputText"
      type="text"
      inputmode="numeric"
      class="form-control"
      [id]="captchaInputId()"
      autocomplete="off"
      [attr.aria-invalid]="
        captchaForm().dntCaptchaInputText().touched() && captchaForm().dntCaptchaInputText().invalid()
      "
      [attr.aria-describedby]="statusId()"
    />
  </div>
</div>
<audio #captchaAudio preload="none" (ended)="playbackEnded()" (error)="playbackFailed()"></audio>
<p
  [id]="statusId()"
  role="status"
  class="small mt-1 mb-0"
  [class.text-danger]="state().status === 'error' || audioError()"
>
  {{ statusMessage() }}
  @if (cooldown.active()) {
    <span aria-hidden="true">Try again in {{ cooldown.remainingSeconds() }}s.</span>
  }
  @if (audioCooldown.active()) {
    <span aria-hidden="true">Try audio again in {{ audioCooldown.remainingSeconds() }}s.</span>
  }
</p>
